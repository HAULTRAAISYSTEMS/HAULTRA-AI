<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HAULTRA Route</title>
  <link rel="manifest" href="/static/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #141420; --surface2: #1e1e30; --accent: #00d4ff;
      --text: #f0f0ff; --text-muted: #8080a0; --success: #22c55e; --warning: #f59e0b;
      --danger: #ef4444; --offline: #ef4444; --online: #22c55e; --radius: 14px;
    }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--surface); border-bottom: 1px solid #1e1e30;
      position: sticky; top: 0; z-index: 100;
    }
    .status-bar h1 { font-size: 1.1rem; color: var(--accent); font-weight: 700; }
    .connection-badge { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .connection-badge.online  { background: #14532d; color: #86efac; }
    .connection-badge.offline { background: #450a0a; color: #fca5a5; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; }
    .connection-badge.online  .conn-dot { background: var(--online); }
    .connection-badge.offline .conn-dot { background: var(--offline); animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--surface); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,200,255,0.1); }
    .login-card h2 { color: var(--accent); font-size: 1.5rem; margin-bottom: 6px; }
    .login-card p  { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 0.85rem; color: var(--text-muted); }
    .field input { padding: 16px; background: var(--surface2); border: 1px solid #2a2a4a; border-radius: 10px; color: var(--text); font-size: 1rem; min-height: 52px; outline: none; }
    .field input:focus { border-color: var(--accent); }
    .btn-login { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; min-height: 52px; cursor: pointer; margin-top: 4px; }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 18px; }
    #app { display: none; }
    .section-header { padding: 16px 16px 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .stop-card { margin: 0 12px 12px; background: var(--surface); border-radius: var(--radius); border-left: 5px solid var(--accent); overflow: hidden; animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .stop-card[data-status="accepted"]    { border-color: #3b82f6; }
    .stop-card[data-status="in_progress"] { border-color: var(--warning); }
    .stop-card[data-status="done"]        { border-color: var(--success); opacity: 0.7; }
    .stop-card[data-status="cancelled"]   { border-color: #374151; opacity: 0.5; }
    .stop-card[data-status="cancelled"] .stop-address { text-decoration: line-through; color: var(--text-muted); }
    .stop-body { padding: 14px 16px; }
    .stop-top  { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .action-badge { padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; min-width: 44px; text-align: center; background: rgba(0,212,255,0.15); color: var(--accent); border: 1px solid var(--accent); }
    .stop-address { font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
    .stop-meta    { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    .stop-status  { font-size: 0.8rem; margin-top: 6px; }
    .status-text-pending     { color: #a5b4fc; }
    .status-text-accepted    { color: #93c5fd; }
    .status-text-in_progress { color: #fcd34d; }
    .status-text-done        { color: #86efac; }
    .status-text-cancelled   { color: #9ca3af; }
    .stop-actions { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
    .btn-action { flex: 1; min-width: 100px; padding: 14px 10px; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; min-height: 52px; transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.3px; }
    .btn-action:active { transform: scale(0.96); }
    .btn-accept   { background: #3b82f6; color: #fff; }
    .btn-progress { background: var(--warning); color: #000; }
    .btn-done     { background: var(--success); color: #000; }
    .btn-nav { flex: 0 0 52px; width: 52px; padding: 14px; border: none; border-radius: 10px; background: var(--surface2); color: var(--text); font-size: 1.3rem; cursor: pointer; min-height: 52px; display: flex; align-items: center; justify-content: center; }
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text-muted); }
    .empty-state .icon { font-size: 3.5rem; margin-bottom: 16px; }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid #1e1e30; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .driver-name { font-weight: 600; font-size: 0.9rem; }
    .logout-btn { background: none; border: 1px solid #3a3a5a; color: var(--text-muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; min-height: 40px; }
  </style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <h2>HAULTRA</h2>
    <p>Driver Route Sheet</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="driver@company.com" autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>
<div id="app">
  <div class="status-bar">
    <h1>MY ROUTE</h1>
    <div class="connection-badge online" id="conn-badge">
      <div class="conn-dot"></div>
      <span id="conn-text">Online</span>
    </div>
  </div>
  <div class="section-header" id="date-header"></div>
  <div id="stops-list"></div>
  <div class="bottom-bar">
    <div class="driver-name" id="driver-name-display">Loading...</div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
</div>
<script type="module">
import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                                 from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, updateDoc, onSnapshot, arrayUnion,
         query, where, orderBy, serverTimestamp, getDoc, Timestamp, enableIndexedDbPersistence }
                                 from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js';
import { firebaseConfig, COMPANY_ID, VAPID_KEY } from './firebase-config.js';

const fbApp   = initializeApp(firebaseConfig);
const auth    = getAuth(fbApp);
const db      = getFirestore(fbApp);
let messaging = null;

enableIndexedDbPersistence(db).catch((e) => {
  if (e.code === 'failed-precondition') console.warn('Offline persistence unavailable: multiple tabs open');
  else if (e.code === 'unimplemented') console.warn('Offline persistence not supported');
});

function updateConnectionStatus(online) {
  const badge = document.getElementById('conn-badge');
  const text  = document.getElementById('conn-text');
  badge.className = 'connection-badge ' + (online ? 'online' : 'offline');
  text.textContent = online ? 'Online' : 'Offline — queuing updates';
}
window.addEventListener('online',  () => updateConnectionStatus(true));
window.addEventListener('offline', () => updateConnectionStatus(false));
updateConnectionStatus(navigator.onLine);

async function initFCM(driverUid) {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    messaging = getMessaging(fbApp);
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { console.log('FCM: notifications denied'); return; }
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) {
      const driverRef = doc(db, 'companies', COMPANY_ID, 'drivers', driverUid);
      await updateDoc(driverRef, { fcmToken: token, lastSeen: serverTimestamp() });
    }
    onMessage(messaging, (payload) => {
      console.log('FCM foreground message:', payload);
      showToast(payload.notification?.body || 'New stop assigned!');
    });
  } catch (e) { console.warn('FCM init error (non-fatal):', e.message); }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, { position: 'fixed', bottom: '80px', left: '50%', transform: 'translateX(-50%)', background: '#1e1e30', color: '#f0f0ff', padding: '12px 20px', borderRadius: '10px', zIndex: 9999, fontSize: '0.9rem', boxShadow: '0 4px 16px rgba(0,0,0,0.4)', maxWidth: '90vw', textAlign: 'center' });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

window.doLogin = async function () {
  const email  = document.getElementById('email').value.trim();
  const pass   = document.getElementById('password').value;
  const errEl  = document.getElementById('login-error');
  errEl.textContent = '';
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (e) { errEl.textContent = friendlyError(e.code); }
};

window.doLogout = async function () {
  if (unsubStops) unsubStops();
  await signOut(auth);
};

let unsubStops = null;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const driverRef = doc(db, 'companies', COMPANY_ID, 'drivers', user.uid);
    const driverDoc = await getDoc(driverRef);
    if (!driverDoc.exists()) {
      document.getElementById('login-error').textContent = 'Driver not found in company.';
      await signOut(auth);
      return;
    }
    const driverData = driverDoc.data();
    showApp(driverData.name || user.email);
    updateLastSeen(user.uid);
    setInterval(() => updateLastSeen(user.uid), 5 * 60 * 1000);
    initFCM(user.uid);
    subscribeStops(user.uid);
  } else {
    showLogin();
  }
});

async function updateLastSeen(uid) {
  try {
    await updateDoc(doc(db, 'companies', COMPANY_ID, 'drivers', uid), { lastSeen: serverTimestamp() });
  } catch (e) { /* offline */ }
}

function showApp(name) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('driver-name-display').textContent = name;
  document.getElementById('date-header').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function friendlyError(code) {
  const map = { 'auth/invalid-email': 'Invalid email.', 'auth/user-not-found': 'Driver account not found.', 'auth/wrong-password': 'Incorrect password.', 'auth/too-many-requests': 'Too many attempts. Try again later.' };
  return map[code] || 'Login failed.';
}

function subscribeStops(driverUid) {
  const todayStart = new Date();
  todayStart.setHours(0, 0, 0, 0);
  const stopsRef = collection(db, 'companies', COMPANY_ID, 'stops');
  const q = query(stopsRef, where('driverUid', '==', driverUid), where('createdAt', '>=', Timestamp.fromDate(todayStart)), orderBy('createdAt', 'asc'), orderBy('sequence', 'asc'));
  let knownIds = new Set();
  unsubStops = onSnapshot(q, (snap) => {
    const stops = [];
    snap.forEach((d) => stops.push({ id: d.id, ...d.data() }));
    stops.forEach((s) => {
      if (!knownIds.has(s.id)) {
        if (knownIds.size > 0) showToast('New stop: ' + s.actionCode + ' — ' + s.address);
        knownIds.add(s.id);
      }
    });
    renderStops(stops, driverUid);
  }, (err) => console.error('Stops subscription error:', err));
}

function renderStops(stops, driverUid) {
  const list = document.getElementById('stops-list');
  const now  = Date.now();
  const visibleStops = stops.filter((s) => {
    if (s.status !== 'cancelled') return true;
    const updatedMs = s.updatedAt?.toMillis?.() || 0;
    return (now - updatedMs) < 60 * 60 * 1000;
  });
  if (!visibleStops.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🚛</div><h3>No stops for today</h3><p>New stops will appear here when dispatched.</p></div>';
    return;
  }
  list.innerHTML = '';
  visibleStops.forEach((stop) => {
    const card = document.createElement('div');
    card.className = 'stop-card';
    card.id = 'stop-' + stop.id;
    card.dataset.status = stop.status;
    const addressEnc = encodeURIComponent(stop.address);
    const mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + addressEnc;
    const meta = [stop.containerSize, stop.notes].filter(Boolean).join(' · ');
    let actionBtns = '';
    if (stop.status === 'pending')     actionBtns = '<button class="btn-action btn-accept" onclick="updateStatus(' + "'" + stop.id + "'" + ', ' + "'accepted'" + ')">Accept</button>';
    else if (stop.status === 'accepted')    actionBtns = '<button class="btn-action btn-progress" onclick="updateStatus(' + "'" + stop.id + "'" + ', ' + "'in_progress'" + ')">Start</button>';
    else if (stop.status === 'in_progress') actionBtns = '<button class="btn-action btn-done" onclick="updateStatus(' + "'" + stop.id + "'" + ', ' + "'done'" + ')">Done</button>';
    card.innerHTML =
      '<div class="stop-body"><div class="stop-top"><span class="action-badge">' + (stop.actionCode || 'P') + '</span><div>' +
      '<div class="stop-address">' + stop.address + '</div>' +
      (meta ? '<div class="stop-meta">' + meta + '</div>' : '') +
      '<div class="stop-status status-text-' + stop.status + '">' + statusLabel(stop.status) + '</div>' +
      '</div></div></div>' +
      '<div class="stop-actions">' + actionBtns +
      '<button class="btn-nav" onclick="window.open(' + "'" + mapsUrl + "'" + ',' + "'_blank'" + ')">Map</button></div>';
    list.appendChild(card);
  });
}

function statusLabel(s) {
  const map = { pending: 'Waiting to accept', accepted: 'Accepted', in_progress: 'In progress', done: 'Completed', cancelled: 'Cancelled' };
  return map[s] || s;
}

window.updateStatus = async function (stopId, newStatus) {
  const user = auth.currentUser;
  if (!user) return;
  try {
    const stopRef = doc(db, 'companies', COMPANY_ID, 'stops', stopId);
    await updateDoc(stopRef, {
      status:        newStatus,
      updatedAt:     serverTimestamp(),
      statusHistory: arrayUnion({ status: newStatus, at: new Date().toISOString(), byUid: user.uid }),
    });
    const card = document.getElementById('stop-' + stopId);
    if (card) card.dataset.status = newStatus;
  } catch (e) {
    console.error('updateStatus error:', e);
    showToast('Status queued — will sync when online.');
  }
};
</script>
</body>
</html>
