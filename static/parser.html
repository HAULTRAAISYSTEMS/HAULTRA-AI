<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FF6B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="csrf-token" content="__CSRF_TOKEN__">
<title>HAULTRA — AI Route Parser</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-0: #121212;
    --bg-1: #171717;
    --bg-2: #1A1A1A;
    --text: #F5F5F0;
    --text-dim: #A6A69E;
    --text-faint: #78786F;
    --orange: #FF6B1A;
    --orange-dim: rgba(255, 107, 26, 0.14);
    --orange-border: rgba(255, 107, 26, 0.55);
    --teal: #00E5CC;
    --teal-dim: rgba(0, 229, 204, 0.10);
    --teal-border: rgba(0, 229, 204, 0.45);
    --red: #FF5252;
    --red-dim: rgba(255, 82, 82, 0.14);
    --green: #3DDC84;
    --slate: #8CA0B3;
    --slate-dim: rgba(140, 160, 179, 0.16);
    --slate-border: rgba(140, 160, 179, 0.45);
    --radius: 14px;
    --radius-sm: 9px;
    --font-head: 'Bebas Neue', 'Anton', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  html { -webkit-text-size-adjust: 100%; }
  html, body { background: var(--bg-0); color: var(--text); min-height: 100vh; }
  body {
    font-family: var(--font-body);
    padding-bottom: 152px;
  }

  a { color: var(--teal); }

  .topbar {
    position: sticky; top: 0; z-index: 90;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-1);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .back-link {
    color: var(--text-dim); text-decoration: none; font-size: 0.85rem; font-weight: 600;
    min-height: 48px; display: flex; align-items: center;
  }
  .back-link:hover { color: var(--text); }
  .page-title {
    font-family: var(--font-head);
    font-size: 1.6rem;
    letter-spacing: 1.5px;
    color: var(--text);
  }
  .page-title .accent { color: var(--teal); }

  .error-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 14px 18px 0;
    padding: 12px 16px;
    background: var(--red-dim);
    border: 1px solid var(--red);
    color: #FFD9D9;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-weight: 500;
  }
  .error-banner[hidden] { display: none; }
  .error-banner button {
    background: none; border: none; color: #FFD9D9; font-size: 1.1rem;
    cursor: pointer; min-width: 32px; min-height: 32px; line-height: 1;
  }

  .toast {
    position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
    background: var(--bg-2); border: 1px solid var(--green); color: var(--green);
    padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem;
    z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .toast.show { opacity: 1; }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    padding: 18px;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 1fr 1fr; align-items: start; }
  }

  .col {
    background: var(--bg-1);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 16px;
  }
  @media (min-width: 900px) {
    .col { position: sticky; top: 76px; }
    .col-output { max-height: calc(100vh - 96px); overflow-y: auto; }
  }

  .col-header {
    font-family: var(--font-head);
    font-size: 1.05rem;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .col-header-row {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin-bottom: 12px;
  }
  .stop-count {
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 3px 10px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .route-ctx-banner {
    margin: 0 18px 14px;
    padding: 14px 16px;
    background: var(--orange-dim);
    border: 1px solid var(--orange-border);
    border-radius: var(--radius);
  }
  .route-ctx-title { font-weight: 700; color: var(--orange); font-size: 0.95rem; margin-bottom: 3px; }
  .route-ctx-sub { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 10px; }
  .seq-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .seq-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px;
    background: var(--bg-0); font-size: 0.82rem;
  }
  .seq-row.seq-done { opacity: 0.6; }
  .seq-row.seq-current { border: 1px solid var(--orange-border); }
  .seq-addr { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seq-state {
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
    color: var(--text-dim); white-space: nowrap;
  }
  .seq-row.seq-current .seq-state { color: var(--orange); }
  .seq-row.seq-done .seq-state { color: var(--green); }
  .insert-before-select {
    width: 100%; margin-top: 8px; min-height: 44px;
    background: var(--bg-1); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text); border-radius: 7px; padding: 8px 10px;
    font-family: var(--font-body); font-size: 0.88rem;
  }
  .insert-before-label {
    display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.4px;
    text-transform: uppercase; color: var(--text-dim); margin-top: 10px;
  }

  .raw-textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    background: var(--bg-0);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.88rem;
    line-height: 1.55;
    padding: 14px;
    outline: none;
  }
  .raw-textarea:focus { border-color: var(--teal-border); }

  /* ── Quick add + live autocomplete ─────────────────────────────── */
  .quick-add { margin-bottom: 18px; }
  .qa-head-row {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
  }
  .qa-hint { font-family: var(--font-body); font-size: 0.72rem; color: var(--text-faint); letter-spacing: 0; }
  .qa-field { position: relative; }
  .qa-input {
    width: 100%;
    min-height: 52px;
    background: var(--bg-0);
    border: 1px solid var(--teal-border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 12px 14px;
    outline: none;
  }
  .qa-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
  .qa-input::placeholder { color: var(--text-faint); }

  .qa-suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    z-index: 120;
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: var(--radius-sm);
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    max-height: 340px; overflow-y: auto;
    padding: 4px;
  }
  .qa-suggest[hidden] { display: none; }
  .qa-row {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    min-height: 48px;
    padding: 8px 10px;
    background: none; border: none; border-radius: 8px;
    text-align: left; cursor: pointer;
    color: var(--text);
  }
  .qa-row:hover, .qa-row:focus { background: rgba(255,255,255,0.06); outline: none; }
  .qa-badge {
    min-width: 42px; min-height: 42px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-size: 1.05rem; letter-spacing: 0.5px;
    border-radius: 9px; flex-shrink: 0;
  }
  .qa-badge.pickup { background: var(--orange-dim); color: var(--orange); border: 1px solid var(--orange-border); }
  .qa-badge.dropswap { background: var(--slate-dim); color: var(--slate); border: 1px solid var(--slate-border); }
  /* Action-badge palette — solid fill + near-black ink (matches haultra-theme.css). */
  .badge-pr,.badge-p,.badge-d,.badge-s,.badge-r,.badge-yard,.badge-ll {
    color:#0A0A0A !important; border:none !important; box-shadow:none !important; text-shadow:none !important; }
  .badge-pr{background:#FF6B1A !important;} .badge-p{background:#FFC53D !important;}
  .badge-d{background:#4DA3FF !important;} .badge-s{background:#A78BFA !important;}
  .badge-r{background:#7C8CA1 !important;} .badge-yard{background:#E5E5E5 !important;}
  .badge-ll{background:#FFC53D !important;}
  .qa-text { flex: 1; min-width: 0; }
  .qa-label { font-size: 0.98rem; font-weight: 700; line-height: 1.25; word-break: break-word; }
  .qa-sub {
    font-size: 0.8rem; color: var(--text-dim); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .qa-size {
    font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600;
    color: var(--teal); background: var(--teal-dim); border: 1px solid var(--teal-border);
    border-radius: 6px; padding: 2px 7px; flex-shrink: 0;
  }
  .qa-empty { padding: 14px 12px; color: var(--text-faint); font-size: 0.85rem; text-align: center; }

  .qa-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .qa-chip {
    display: inline-flex; align-items: stretch; gap: 0;
    min-height: 48px;
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    color: var(--text);
    overflow: hidden;
  }
  .qa-chip:hover, .qa-chip:focus-within { border-color: var(--teal-border); background: var(--teal-dim); }
  .qa-chip-tap {
    display: inline-flex; align-items: center; gap: 9px;
    min-height: 48px; padding: 6px 4px 6px 14px;
    background: transparent; border: none; color: inherit; cursor: pointer;
    font-family: var(--font-body); text-align: left;
  }
  .qa-chip .qa-chip-badge {
    font-family: var(--font-head); font-size: 0.82rem; letter-spacing: 0.5px;
    color: var(--teal); flex: none;
  }
  .qa-chip-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .qa-chip-name { font-size: 0.86rem; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
  .qa-chip-sub { font-size: 0.72rem; font-weight: 500; color: var(--text-dim, #8C8C82);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
  .qa-chip-x {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 48px; align-self: stretch; padding: 0 6px;
    background: transparent; border: none; border-left: 1px solid rgba(255,255,255,0.10);
    color: var(--text-dim, #8C8C82); font-size: 0.9rem; cursor: pointer;
  }
  .qa-chip-x:hover, .qa-chip-x:focus { color: var(--red, #FF5252); background: rgba(255,82,82,0.10); outline: none; }
  .qa-chips-empty { display: none; }

  .btn {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.92rem;
    border-radius: var(--radius-sm);
    min-height: 48px;
    padding: 0 18px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: opacity 0.15s, transform 0.08s, background 0.15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { cursor: not-allowed; opacity: 0.55; }

  .btn-teal-outline {
    background: var(--teal-dim);
    border-color: var(--teal-border);
    color: var(--teal);
    width: 100%;
    margin-top: 12px;
  }
  .btn-teal-outline:hover:not(:disabled) { background: rgba(0,229,204,0.18); }

  .btn-secondary {
    background: transparent;
    border-color: rgba(255,255,255,0.15);
    color: var(--text-dim);
  }
  .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .btn-secondary.active {
    color: var(--teal);
    border-color: var(--teal-border);
    background: var(--teal-dim);
  }

  .btn-orange-outline {
    background: transparent;
    border-color: var(--orange-border);
    color: var(--orange);
  }
  .btn-orange-solid {
    background: var(--orange);
    border-color: var(--orange);
    color: #1A1000;
  }
  .btn-orange-solid:hover:not(:disabled) { background: #ff7a2e; }

  .flag-pill {
    background: var(--orange-dim);
    border: 1px solid var(--orange-border);
    color: var(--orange);
    font-size: 0.78rem;
    font-weight: 700;
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    min-height: 32px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .flag-pill[hidden] { display: none; }
  .flag-pill:hover { background: rgba(255,107,26,0.24); }

  .empty-state {
    color: var(--text-faint);
    font-size: 0.9rem;
    padding: 28px 12px;
    text-align: center;
    line-height: 1.6;
  }

  .stop-cards { display: flex; flex-direction: column; gap: 12px; }

  .stop-card {
    background: var(--bg-0);
    border: 2px solid var(--teal-border);
    border-radius: var(--radius);
    padding: 14px;
    scroll-margin-top: 90px;
  }
  .stop-card.flagged {
    border-color: var(--orange);
    box-shadow: inset 0 0 0 1px rgba(255,107,26,0.18);
  }

  .stop-card-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    margin-bottom: 10px;
  }
  .stop-card-remove {
    margin-left: auto; flex: none;
    min-width: 44px; min-height: 44px; padding: 0 10px;
    background: transparent; border: 1px solid rgba(255,82,82,0.35); border-radius: 8px;
    color: var(--red, #FF5252); font-size: 0.95rem; cursor: pointer; line-height: 1;
  }
  .stop-card-remove:hover, .stop-card-remove:focus { background: rgba(255,82,82,0.12); outline: none; }
  .ai-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.8px;
    color: var(--teal); text-transform: uppercase;
  }
  .review-tag {
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.6px;
    color: var(--orange); text-transform: uppercase;
    background: var(--orange-dim); border-radius: 4px; padding: 2px 6px;
  }

  .stop-card-body { display: flex; gap: 12px; align-items: flex-start; }

  .action-badge {
    min-width: 48px; min-height: 48px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head);
    font-size: 1.25rem;
    letter-spacing: 0.5px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .action-badge.pickup {
    background: var(--orange-dim); color: var(--orange); border: 1px solid var(--orange-border);
  }
  .action-badge.dropswap {
    background: var(--slate-dim); color: var(--slate); border: 1px solid var(--slate-border);
  }

  .stop-main { flex: 1; min-width: 0; }
  .stop-address {
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.3;
    word-break: break-word;
  }
  .stop-address input, .stop-container input, .stop-action select {
    width: 100%;
    background: var(--bg-1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    border-radius: 7px;
    padding: 8px 10px;
    font-family: var(--font-body);
    font-size: 0.95rem;
    min-height: 40px;
  }
  .stop-container {
    font-size: 0.86rem;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .stop-notes {
    font-size: 0.82rem;
    color: var(--text-faint);
    margin-top: 6px;
    font-style: italic;
  }
  .stop-legs {
    margin-top: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--orange);
  }

  /* Manual (Quick-Add) stop cards — deliberately NOT teal (teal = AI only). */
  .stop-card.manual { border-color: var(--orange-border); }
  .stop-card.manual.editable { cursor: pointer; }
  .manual-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.8px;
    color: var(--orange); text-transform: uppercase;
  }

  /* ── Confirm / Edit Stop bottom sheet ─────────────────────────── */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.55);
    display: none;
  }
  .sheet-backdrop.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
    background: var(--bg-1);
    border-top-left-radius: var(--radius); border-top-right-radius: var(--radius);
    border-top: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 -12px 40px rgba(0,0,0,0.5);
    max-height: 92vh; max-height: 92dvh;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.22s ease;
  }
  .sheet-backdrop.open .sheet { transform: translateY(0); }
  .sheet-head {
    flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .sheet-title { font-family: var(--font-head); font-size: 1.35rem; letter-spacing: 1px; color: var(--text); }
  .sheet-close {
    min-width: 48px; min-height: 48px; flex: none;
    background: transparent; border: none; color: var(--text-dim);
    font-size: 1.2rem; cursor: pointer; line-height: 1;
  }
  .sheet-close:hover, .sheet-close:focus { color: var(--text); outline: none; }
  .sheet-body {
    flex: 1 1 auto;
    padding: 14px 18px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sheet-field { margin-bottom: 15px; }
  .sheet-label {
    display: block;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 7px;
  }
  /* 16px minimum font-size on inputs prevents iOS Safari auto-zoom on focus. */
  .sheet-input {
    width: 100%;
    background: var(--bg-0);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-family: var(--font-body);
    font-size: 16px;
    min-height: 48px;
  }
  .sheet-input:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-dim); }
  .sheet-input.invalid { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-dim); }
  .sheet-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-chip {
    min-height: 48px; min-width: 48px; padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-0); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim); border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; cursor: pointer; line-height: 1;
  }
  .sheet-chip.active { background: var(--orange-dim); border-color: var(--orange-border); color: var(--orange); }
  .sheet-chip:focus { outline: none; box-shadow: 0 0 0 3px var(--teal-dim); }
  .sheet-foot {
    flex: none;
    display: flex; gap: 10px;
    padding: 12px 18px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .sheet-foot .btn { flex: 1; min-height: 52px; }

  .stop-raw {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed rgba(255,255,255,0.10);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-faint);
    word-break: break-word;
  }
  .stop-raw .lbl { color: var(--text-dim); font-weight: 600; }

  .stop-card-actions {
    margin-top: 12px;
    display: flex; justify-content: flex-end;
  }
  .btn-mark-reviewed {
    background: transparent;
    border: 1px solid var(--orange-border);
    color: var(--orange);
    font-size: 0.8rem;
    font-weight: 700;
    border-radius: var(--radius-sm);
    min-height: 40px;
    padding: 0 14px;
    cursor: pointer;
  }
  .btn-mark-reviewed:hover { background: var(--orange-dim); }

  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 18px 14px;

  .assign-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;

  .assign-row label {

  .driver-select {
    flex: 1; min-width: 160px; min-height: 44px;

  @media (max-width: 480px) {
    .page-title { font-size: 1.3rem; }
    .stop-address { font-size: 1.05rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="/">&larr; HAULTRA</a>
  <div class="page-title"><span class="accent">✦</span> AI ROUTE PARSER</div>
  <div style="width:70px;"></div>
</div>

<div id="error-banner" class="error-banner" role="alert" hidden>
  <span id="error-banner-text"></span>
  <button type="button" onclick="dismissError()" aria-label="Dismiss">&times;</button>
</div>

<!--ROUTE_SEQ_SLOT-->

<main class="layout">
  <section class="col col-input">
    <div class="quick-add">
      <div class="qa-head-row">
        <div class="col-header" style="margin-bottom:0;">QUICK ADD</div>
        <span class="qa-hint">type a name, street, or city &mdash; tap to add a stop</span>
      </div>
      <div class="qa-field">
        <input id="qa-input" class="qa-input" type="text" autocomplete="off"
               autocapitalize="words" spellcheck="false" enterkeyhint="done"
               placeholder="e.g. Serv Pro, Clyde Morris, Newport News&hellip;"
               aria-label="Quick add a saved location" aria-autocomplete="list"
               aria-controls="qa-suggest">
        <div id="qa-suggest" class="qa-suggest" role="listbox" hidden></div>
      </div>
      <div id="qa-chips" class="qa-chips" aria-label="Recent and frequent locations"></div>
    </div>
    <div class="col-header">STEP 1 &middot; RAW DISPATCH TEXT</div>
    <textarea id="raw-text" class="raw-textarea" placeholder="Paste dispatch text here... e.g.&#10;pull n return 4512 elm st 30yd&#10;drop empty 88 harbor rd 20&#10;swap 770 industrial pkwy 40yd"></textarea>
    <button id="reparse-btn" class="btn btn-teal-outline" onclick="reparse()">✦ Re-parse with AI</button>
  </section>

  <section class="col col-output">
    <div class="col-header-row">
      <div class="col-header">STEP 2 &middot; AI-PARSED ROUTE<span id="stop-count-badge" class="stop-count">0 stops</span></div>
      <button id="flag-pill" class="flag-pill" hidden onclick="scrollToFirstFlagged()">
        &#9888; <span id="flag-count">0</span> need a look
      </button>
    </div>
    <div id="stop-cards" class="stop-cards">
      <div class="empty-state">Paste dispatch text on the left and click &ldquo;Re-parse with AI&rdquo; to build your route.</div>
    </div>
  </section>
</main>

<div class="bottom-bar">
  <div class="assign-row" id="assign-row"><!--ASSIGN_SLOT--></div>
  <div class="dispatch-row">
    <button id="edit-btn" class="btn btn-secondary" onclick="toggleEditMode()">Edit stops</button>
    <button id="confirm-btn" class="btn btn-orange-outline" disabled onclick="confirmDispatch()">⚡ Confirm &amp; Dispatch 0 Stops</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- Confirm / Edit Stop bottom sheet: a Quick-Add suggestion or chip opens this
     prefilled instead of committing instantly; nothing is added until Add Stop. -->
<div id="stop-sheet-backdrop" class="sheet-backdrop" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div id="sheet-title" class="sheet-title">Confirm Stop</div>
      <button type="button" id="sheet-close" class="sheet-close" aria-label="Cancel">&times;</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-field">
        <span class="sheet-label">Action</span>
        <div id="sheet-actions" class="sheet-chips" role="group" aria-label="Action"></div>
      </div>
      <div class="sheet-field">
        <label class="sheet-label" for="sheet-customer">Customer</label>
        <input id="sheet-customer" class="sheet-input" type="text" autocomplete="off"
               autocapitalize="words" spellcheck="false" placeholder="Customer name">
      </div>
      <div class="sheet-field">
        <label class="sheet-label" for="sheet-address">Address</label>
        <input id="sheet-address" class="sheet-input" type="text" autocomplete="off"
               autocapitalize="words" spellcheck="false" placeholder="Street address" required>
      </div>
      <div class="sheet-field">
        <span class="sheet-label">Container size</span>
        <div id="sheet-sizes" class="sheet-chips" role="group" aria-label="Container size"></div>
      </div>
      <div class="sheet-field">
        <label class="sheet-label" for="sheet-dump">Dump at (site)</label>
        <input id="sheet-dump" class="sheet-input" type="text" autocomplete="off"
               list="sheet-dump-list" placeholder="e.g. transfer station (optional)">
        <datalist id="sheet-dump-list"></datalist>
      </div>
      <div class="sheet-field">
        <label class="sheet-label" for="sheet-return">Return to</label>
        <input id="sheet-return" class="sheet-input" type="text" autocomplete="off"
               list="sheet-return-list" placeholder="e.g. yard (optional)">
        <datalist id="sheet-return-list"></datalist>
      </div>
      <div class="sheet-field">
        <label class="sheet-label" for="sheet-note">Note</label>
        <input id="sheet-note" class="sheet-input" type="text" autocomplete="off"
               autocapitalize="sentences" placeholder="Anything the driver should know (optional)">
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" id="sheet-cancel" class="btn btn-secondary">Cancel</button>
      <button type="button" id="sheet-add" class="btn btn-orange-solid">Add Stop</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var ACTION_META = {
    PR:   { full: 'Pull & Return', group: 'pickup' },
    P:    { full: 'Pickup',        group: 'pickup' },
    D:    { full: 'Drop',          group: 'dropswap' },
    S:    { full: 'Swap',          group: 'dropswap' },
    R:    { full: 'Relocate',      group: 'dropswap' },
    YARD: { full: 'Yard',          group: 'dropswap' },
  };
  var ACTION_CODES = Object.keys(ACTION_META);
  // Order of the action chips in the Confirm-Stop sheet.
  var SHEET_ACTIONS = ['P', 'D', 'S', 'PR', 'R', 'YARD'];

  var currentStops = [];
  var editMode = false;
  var toastTimer = null;
  var CSRF_TOKEN = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
  var ROUTE_MODE = __ROUTE_MODE_JSON__;
  // Company data injected by parser_view() for the Confirm-Stop sheet — real
  // dump sites / yard / container sizes, never hardcoded.
  var DUMP_SITES      = __DUMP_SITES_JSON__;
  var RETURN_SITES    = __RETURN_SITES_JSON__;
  var CONTAINER_SIZES = __CONTAINER_SIZES_JSON__;

  function el(id) { return document.getElementById(id); }

  function showError(msg) {
    el('error-banner-text').textContent = msg;
    el('error-banner').hidden = false;
  }
  window.dismissError = function () { el('error-banner').hidden = true; };

  function showToast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  // Monotonic id source so every card (parsed OR quick-added) has a stable,
  // collision-free id — the two lanes coexist and must never share an id.
  var stopSeq = 0;

  function normalizeStop(raw) {
    var action = (raw && raw.action ? String(raw.action) : '').trim().toUpperCase();
    if (ACTION_CODES.indexOf(action) === -1) action = action || 'P';
    var confidence = (raw && raw.confidence === 'low') ? 'low' : 'high';
    // Provenance: 'manual' = hand-entered via the Confirm-Stop sheet (never teal,
    // dispatch-ready); 'ai' = returned by the model; 'parsed' = legacy default.
    // Legacy 'quickadd' maps to 'manual'.
    var rawSrc = raw && raw.source;
    var source = (rawSrc === 'manual' || rawSrc === 'quickadd') ? 'manual'
               : (rawSrc === 'ai') ? 'ai' : 'parsed';
    var isManual = source === 'manual';
    return {
      id: 'stop-' + (stopSeq++),
      source: source,
      action: action,
      address: (raw && raw.address) ? String(raw.address) : '',
      customer: (raw && raw.customer) ? String(raw.customer) : '',
      container_size: (raw && raw.container_size) ? String(raw.container_size) : '',
      dump_leg: (raw && raw.dump_leg) ? String(raw.dump_leg) : '',
      return_leg: (raw && raw.return_leg) ? String(raw.return_leg) : '',
      // Verbatim can-swap hint from the parser; the server resolves the link.
      chain_hint: (raw && raw.chain_hint) ? raw.chain_hint : null,
      raw: (raw && raw.raw) ? String(raw.raw) : '',
      confidence: confidence,
      notes: (raw && raw.notes) ? String(raw.notes) : '',
      // Manual stops came from a saved location / explicit entry — trusted, so
      // they're never flagged for review.
      reviewed: isManual ? true : false,
      insert_before: 'end',
    };
  }

  function reparse() {
    var text = el('raw-text').value.trim();
    var btn = el('reparse-btn');
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Parsing...';
    dismissError();

    // Hand-entered stops ride along so the server places them FIRST and never
    // runs them through the model. They stay in currentStops if the request
    // fails, so a network error never loses them.
    var manualStops = currentStops
      .filter(function (s) { return s.source === 'manual'; })
      .map(serializeManualStop);

    fetch('/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
      body: JSON.stringify({ text: text, manual_stops: manualStops }),
    })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (data) {
          return { ok: r.ok, data: data };
        });
      })
      .then(function (res) {
        if (!res.ok || !res.data || !Array.isArray(res.data.stops)) {
          throw new Error((res.data && res.data.error) || 'Parser returned an unexpected response — try again.');
        }
        renderStopCards(res.data.stops);
        if (res.data.partial_failure) {
          // The AI leg failed but the server returned the hand-entered stops —
          // surface the reason without discarding that work.
          showError(res.data.warning || 'AI parsing is unavailable right now — your Quick-Add stops are kept. Try re-parsing the dispatch text again.');
        }
      })
      .catch(function (err) {
        showError(err.message || 'Network error — try again.');
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = original;
      });
  }
  window.reparse = reparse;

  function renderStopCards(stops) {
    // The server returns the full ordered draft: hand-entered (manual) stops
    // FIRST, then AI-parsed stops — each already tagged with its source. We
    // rebuild currentStops from that response verbatim (respecting source), so
    // manual stops keep their non-teal treatment and the model never rewrites
    // them. Re-parsing the same text twice can't duplicate or drop stops because
    // the client's manual stops were sent along and echoed back in place.
    currentStops = (stops || []).map(function (raw) { return normalizeStop(raw); });
    renderAllCards();
    updateCounts();
  }
  window.renderStopCards = renderStopCards;

  function renderAllCards() {
    var container = el('stop-cards');
    container.innerHTML = '';
    if (!currentStops.length) {
      container.innerHTML = '<div class="empty-state">No stops detected. Check the dispatch text and re-parse.</div>';
      refreshChainPreview();
      return;
    }
    currentStops.forEach(function (stop) {
      container.appendChild(buildCard(stop));
    });
    refreshChainPreview();
  }

  // Pre-insert can-swap preview: the server runs the SAME resolver over the
  // confirm-sheet order and returns the whole chain(s) + any BLOCKING size
  // mismatch, so the boss sees the chain at a glance before dispatching. The
  // summary card renders above the stop list; the chain is editable in Edit Stop
  // after dispatch (the "Swaps with" picker).
  function refreshChainPreview() {
    var host = el('chain-summary');
    if (!host) {
      var cards = el('stop-cards');
      host = document.createElement('div');
      host.id = 'chain-summary';
      cards.parentNode.insertBefore(host, cards);
    }
    if (!currentStops.length) { host.innerHTML = ''; return; }
    var payload = { stops: currentStops.map(function (s) {
      return { action: s.action, address: s.address, container_size: s.container_size, notes: s.notes };
    }) };
    fetch('/api/chain-preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (data) {
      host.innerHTML = renderChainSummary(data);
    }).catch(function () { host.innerHTML = ''; });
  }

  function _esc2(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderChainSummary(data) {
    var html = '';
    (data.errors || []).forEach(function (m) {
      html += '<div style="margin:8px 0;padding:10px 13px;border-radius:8px;background:rgba(255,59,92,.12);' +
              'border:1px solid rgba(255,59,92,.4);color:#ff8099;font-size:13px;font-weight:600;">&#9888; ' + _esc2(m) + '</div>';
    });
    (data.chains || []).forEach(function (c) {
      var term = c.terminal === 'yard' ? 'Final empty &rarr; back to the yard'
               : c.terminal === 'none' ? 'Final can just gets dumped (no return)'
               : 'Final empty &rarr; back to ' + _esc2((c.stops[0] || {}).address || 'the first stop');
      var lines = c.stops.map(function (st) {
        return '<div style="display:flex;gap:8px;font-size:13px;padding:2px 0;">' +
               '<span style="opacity:.6;min-width:20px;">' + (st.seq + 1) + '.</span>' +
               '<span style="flex:1;">' + _esc2(st.address || '') + '</span>' +
               '<span style="opacity:.7;">' + _esc2(st.size || '') + '</span></div>';
      }).join('');
      html += '<div style="margin:10px 0;padding:12px 14px;border-radius:10px;background:rgba(140,160,179,.10);' +
              'border:1px solid rgba(140,160,179,.35);">' +
              '<div style="font-weight:800;letter-spacing:.4px;font-size:12px;text-transform:uppercase;color:#B8C6D4;margin-bottom:8px;">' +
              '&#128257; Swap chain &mdash; ' + c.trips + ' stops, ' + c.trips + ' dump trips</div>' +
              lines +
              '<div style="margin-top:8px;font-size:12px;color:#9fb0c0;">' + term + '</div></div>';
    });
    (data.infos || []).forEach(function (m) {
      html += '<div style="margin:6px 0;padding:8px 12px;border-radius:8px;background:rgba(255,157,0,.09);' +
              'border:1px solid rgba(255,157,0,.3);color:#fbbf24;font-size:12px;">' + _esc2(m) + '</div>';
    });
    return html;
  }

  function buildCard(stop) {
    var isManual = stop.source === 'manual';
    var flagged = stop.confidence === 'low' && !stop.reviewed;
    var card = document.createElement('div');
    card.className = 'stop-card' + (flagged ? ' flagged' : '') + (isManual ? ' manual editable' : '');
    card.id = stop.id;

    var meta = ACTION_META[stop.action] || ACTION_META.P;

    var top = document.createElement('div');
    top.className = 'stop-card-top';
    // Teal "AI PARSED" tag is AI-only; manual stops get a neutral orange tag.
    var tag = document.createElement('span');
    if (isManual) {
      tag.className = 'manual-tag';
      tag.textContent = '✎ QUICK ADD';
    } else {
      tag.className = 'ai-tag';
      tag.textContent = '✦ AI PARSED';
    }
    top.appendChild(tag);
    if (flagged) {
      var reviewTag = document.createElement('span');
      reviewTag.className = 'review-tag';
      reviewTag.textContent = 'NEEDS REVIEW';
      top.appendChild(reviewTag);
    }
    // Remove this stop from the draft before dispatch (✕ or long-press the card).
    var rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'stop-card-remove';
    rm.setAttribute('aria-label', 'Remove this stop from the draft');
    rm.textContent = '✕';
    rm.addEventListener('click', function (ev) { ev.stopPropagation(); removeStop(stop.id); });
    top.appendChild(rm);
    card.appendChild(top);
    var cardDidLongPress = attachLongPress(card, function () { removeStop(stop.id); });
    if (isManual) {
      // Tapping an already-added Quick-Add stop reopens the sheet in Edit mode
      // and saves in place — no duplicate. A long-press still removes it.
      card.addEventListener('click', function (ev) {
        if (cardDidLongPress && cardDidLongPress()) return;   // long-press handled it
        if (ev.target && ev.target.closest && ev.target.closest('.stop-card-remove')) return;
        openStopSheet(stopToPrefill(stop), stop.id);
      });
    }

    var body = document.createElement('div');
    body.className = 'stop-card-body';

    var badge = document.createElement('div');
    badge.className = 'action-badge badge-' + String(stop.action || 'D').toLowerCase();
    badge.title = meta.full;
    badge.textContent = stop.action;
    body.appendChild(badge);

    var main = document.createElement('div');
    main.className = 'stop-main';

    // Manual stops are edited through the sheet (tap the card), never inline —
    // so they always render as read-only display rows.
    if (editMode && !isManual) {
      var actionSel = document.createElement('div');
      actionSel.className = 'stop-action';
      var sel = document.createElement('select');
      ACTION_CODES.forEach(function (code) {
        var opt = document.createElement('option');
        opt.value = code;
        opt.textContent = code + ' — ' + ACTION_META[code].full;
        if (code === stop.action) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', function () {
        stop.action = sel.value;
        renderAllCards();
      });
      actionSel.appendChild(sel);
      main.appendChild(actionSel);

      var addrWrap = document.createElement('div');
      addrWrap.className = 'stop-address';
      addrWrap.style.marginTop = '8px';
      var addrInput = document.createElement('input');
      addrInput.type = 'text';
      addrInput.value = stop.address;
      addrInput.placeholder = 'Address';
      addrInput.addEventListener('input', function () { stop.address = addrInput.value; });
      addrWrap.appendChild(addrInput);
      main.appendChild(addrWrap);

      var contWrap = document.createElement('div');
      contWrap.className = 'stop-container';
      var contInput = document.createElement('input');
      contInput.type = 'text';
      contInput.value = stop.container_size;
      contInput.placeholder = 'Container size (e.g. 30yd)';
      contInput.addEventListener('input', function () { stop.container_size = contInput.value; });
      contWrap.appendChild(contInput);
      main.appendChild(contWrap);
      var custWrap = document.createElement('div');
      custWrap.className = 'stop-container';
      custWrap.style.marginTop = '8px';
      var custInput = document.createElement('input');
      custInput.type = 'text';
      custInput.value = stop.customer || '';
      custInput.placeholder = 'Customer (optional)';
      custInput.addEventListener('input', function () { stop.customer = custInput.value; });
      custWrap.appendChild(custInput);
      main.appendChild(custWrap);

      var dumpWrap = document.createElement('div');
      dumpWrap.className = 'stop-container';
      var dumpInput = document.createElement('input');
      dumpInput.type = 'text';
      dumpInput.value = stop.dump_leg || '';
      dumpInput.placeholder = 'Dump at (site, optional)';
      dumpInput.addEventListener('input', function () { stop.dump_leg = dumpInput.value; });
      dumpWrap.appendChild(dumpInput);
      main.appendChild(dumpWrap);

      var retWrap = document.createElement('div');
      retWrap.className = 'stop-container';
      var retInput = document.createElement('input');
      retInput.type = 'text';
      retInput.value = stop.return_leg || '';
      retInput.placeholder = 'Return to (yard/site, optional)';
      retInput.addEventListener('input', function () { stop.return_leg = retInput.value; });
      retWrap.appendChild(retInput);
      main.appendChild(retWrap);
    } else {
      var addr = document.createElement('div');
      addr.className = 'stop-address';
      addr.textContent = stop.address || '(no address detected)';
      main.appendChild(addr);

      var subBits = [];
      if (stop.container_size) subBits.push(stop.container_size);
      if (stop.customer) subBits.push(stop.customer);
      if (subBits.length) {
        var cont = document.createElement('div');
        cont.className = 'stop-container';
        cont.textContent = subBits.join(' · ');
        main.appendChild(cont);
      }

      // Multi-leg trip: "→ Dump: Holland → Return: Paragon"
      if (stop.dump_leg || stop.return_leg) {
        var legs = document.createElement('div');
        legs.className = 'stop-legs';
        var t = '';
        if (stop.dump_leg) t += '→ Dump: ' + stop.dump_leg + ' ';
        if (stop.return_leg) t += '→ Return: ' + stop.return_leg;
        legs.textContent = t.trim();
        main.appendChild(legs);
      }
    }

    if (stop.notes) {
      var notes = document.createElement('div');
      notes.className = 'stop-notes';
      notes.textContent = stop.notes;
      main.appendChild(notes);
    }

    if (ROUTE_MODE) {
      var posLabel = document.createElement('label');
      posLabel.className = 'insert-before-label';
      posLabel.textContent = 'Insert Before';
      main.appendChild(posLabel);

      var posSel = document.createElement('select');
      posSel.className = 'insert-before-select';
      posSel.innerHTML = ROUTE_MODE.insert_options_html;
      var endOpt = document.createElement('option');
      endOpt.value = 'end';
      endOpt.textContent = 'End of Route';
      posSel.appendChild(endOpt);
      posSel.value = stop.insert_before || 'end';
      posSel.addEventListener('change', function () {
        stop.insert_before = posSel.value;
      });
      main.appendChild(posSel);
    }

    body.appendChild(main);
    card.appendChild(body);

    if (stop.raw) {
      var rawEl = document.createElement('div');
      rawEl.className = 'stop-raw';
      var lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = 'raw: ';
      rawEl.appendChild(lbl);
      rawEl.appendChild(document.createTextNode(stop.raw));
      card.appendChild(rawEl);
    }

    if (flagged) {
      var actions = document.createElement('div');
      actions.className = 'stop-card-actions';
      var markBtn = document.createElement('button');
      markBtn.type = 'button';
      markBtn.className = 'btn-mark-reviewed';
      markBtn.textContent = 'Mark reviewed';
      markBtn.addEventListener('click', function () { markReviewed(stop.id); });
      actions.appendChild(markBtn);
      card.appendChild(actions);
    }

    return card;
  }

  function markReviewed(id) {
    var stop = currentStops.find(function (s) { return s.id === id; });
    if (!stop) return;
    stop.reviewed = true;
    renderAllCards();
    updateCounts();
  }

  function removeStop(id) {
    var stop = currentStops.find(function (s) { return s.id === id; });
    var label = stop ? (stop.customer || stop.address || 'this stop') : 'this stop';
    if (!window.confirm('Remove ' + label + ' from this route?')) return;
    currentStops = currentStops.filter(function (s) { return s.id !== id; });
    renderAllCards();   // list re-renders, positions close ranks
    updateCounts();
    showToast('Stop removed');
  }
  window.markReviewed = markReviewed;

  function updateCounts() {
    var count = currentStops.length;
    var flaggedUnreviewed = currentStops.filter(function (s) {
      return s.confidence === 'low' && !s.reviewed;
    }).length;

    el('stop-count-badge').textContent = count + (count === 1 ? ' stop' : ' stops');

    var pill = el('flag-pill');
    if (flaggedUnreviewed > 0) {
      el('flag-count').textContent = flaggedUnreviewed;
      pill.hidden = false;
    } else {
      pill.hidden = true;
    }

    var confirmBtn = el('confirm-btn');
    var driverSelect = el('driver-select');
    var noDriversAtAll = !driverSelect && !!el('assign-row') && el('assign-row').querySelector('.no-drivers-msg');
    var verb = ROUTE_MODE ? 'Insert' : 'Confirm & Dispatch';

    if (count === 0) {
      confirmBtn.disabled = true;
      confirmBtn.className = 'btn btn-orange-outline';
      confirmBtn.textContent = '⚡ ' + verb + ' 0 Stops';
    } else if (flaggedUnreviewed > 0) {
      confirmBtn.disabled = true;
      confirmBtn.className = 'btn btn-orange-outline';
      confirmBtn.textContent = '⚠ Review ' + flaggedUnreviewed + ' Flagged Stop' + (flaggedUnreviewed === 1 ? '' : 's');
    } else if (noDriversAtAll) {
      confirmBtn.disabled = true;
      confirmBtn.className = 'btn btn-orange-outline';
      confirmBtn.textContent = '⚡ Add a Driver First';
    } else if (driverSelect && !driverSelect.value) {
      confirmBtn.disabled = true;
      confirmBtn.className = 'btn btn-orange-outline';
      confirmBtn.textContent = '⚡ Select a Driver to Dispatch';
    } else {
      confirmBtn.disabled = false;
      confirmBtn.className = 'btn btn-orange-solid';
      confirmBtn.textContent = '⚡ ' + verb + ' ' + count + ' Stop' + (count === 1 ? '' : 's');
    }
  }

  function scrollToFirstFlagged() {
    var card = document.querySelector('.stop-card.flagged');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  window.scrollToFirstFlagged = scrollToFirstFlagged;

  function toggleEditMode() {
    editMode = !editMode;
    el('edit-btn').classList.toggle('active', editMode);
    el('edit-btn').textContent = editMode ? 'Done editing' : 'Edit stops';
    renderAllCards();
  }
  window.toggleEditMode = toggleEditMode;

  function confirmDispatch() {
    var btn = el('confirm-btn');
    if (btn.disabled) return;

    var url, payload, verbing, successMsg;

    if (ROUTE_MODE) {
      url = '/api/route/' + ROUTE_MODE.route_id + '/insert-stops';
      payload = {
        stops: currentStops.map(function (s) {
          return {
            action: s.action,
            address: s.address,
            customer: s.customer,
            container_size: s.container_size,
            dump_leg: s.dump_leg,
            return_leg: s.return_leg,
            notes: s.notes,
            confidence: s.confidence,
            reviewed: s.reviewed,
            chain_hint: s.chain_hint || null,
            insert_before: s.insert_before || 'end',
          };
        }),
      };
      verbing = 'Inserting...';
    } else {
      var driverSelect = el('driver-select');
      var driverId = driverSelect ? driverSelect.value : '';
      if (!driverId) return;
      url = '/api/dispatch';
      payload = {
        driver_id: driverId,
        stops: currentStops.map(function (s) {
          return {
            action: s.action,
            address: s.address,
            customer: s.customer,
            container_size: s.container_size,
            dump_leg: s.dump_leg,
            return_leg: s.return_leg,
            notes: s.notes,
            confidence: s.confidence,
            reviewed: s.reviewed,
            chain_hint: s.chain_hint || null,
          };
        }),
      };
      verbing = 'Dispatching...';
    }

    dismissError();
    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = verbing;

    fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': CSRF_TOKEN,
      },
      credentials: 'same-origin',
      body: JSON.stringify(payload),
    })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (data) {
          return { ok: r.ok, data: data };
        });
      })
      .then(function (res) {
        if (!res.ok || !res.data || !res.data.success) {
          var verb = ROUTE_MODE ? 'Insert' : 'Dispatch';
          throw new Error((res.data && res.data.error) || (verb + ' failed — try again.'));
        }
        successMsg = ROUTE_MODE
          ? ('✓ ' + res.data.stop_count + ' stop' + (res.data.stop_count === 1 ? '' : 's') + ' added to the route')
          : ('✓ Route dispatched to ' + res.data.driver + ' — ' + res.data.stop_count + ' stops');
        showToast(successMsg);
        btn.textContent = '✓ Done — redirecting…';
        setTimeout(function () { window.location.href = '/routes'; }, 1100);
      })
      .catch(function (err) {
        showError(err.message || 'Request failed — try again.');
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }
  window.confirmDispatch = confirmDispatch;

  // ── Confirm / Edit Stop bottom sheet ────────────────────────────
  // A Quick-Add suggestion/chip (or tapping a pending manual card) opens this
  // sheet prefilled; nothing is committed until "Add Stop"/"Save". Editing the
  // sheet only mutates a local draft object — it never writes the address book,
  // so changing a size for today leaves the saved default untouched.
  var sheetMode   = 'add';    // 'add' | 'edit'
  var sheetEditId = null;     // stop id when editing an existing pending stop
  var sheetAction = 'P';
  var sheetSize   = '';

  function serializeManualStop(s) {
    return {
      action: s.action, address: s.address, customer: s.customer,
      container_size: s.container_size, dump_leg: s.dump_leg,
      return_leg: s.return_leg, notes: s.notes,
    };
  }

  function prefillFromLoc(loc) {
    // Copy-on-write: values are READ off the saved location into a plain object.
    return {
      action: codeFromAction(loc.default_action),
      customer: loc.customer_name || '',
      address: locFullAddress(loc),
      container_size: loc.default_container_size || '',
      dump_leg: loc.default_dump_location || '',
      return_leg: '',
      notes: '',
    };
  }

  function stopToPrefill(stop) {
    return {
      action: stop.action, customer: stop.customer, address: stop.address,
      container_size: stop.container_size, dump_leg: stop.dump_leg,
      return_leg: stop.return_leg, notes: stop.notes,
    };
  }

  function fillDatalist(id, values) {
    var dl = el(id);
    if (!dl) return;
    dl.innerHTML = '';
    (values || []).forEach(function (v) {
      if (!v) return;
      var o = document.createElement('option');
      o.value = v;
      dl.appendChild(o);
    });
  }

  function renderSheetActionChips() {
    var wrap = el('sheet-actions');
    if (!wrap) return;
    wrap.innerHTML = '';
    SHEET_ACTIONS.forEach(function (code) {
      var meta = ACTION_META[code] || ACTION_META.P;
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'sheet-chip' + (code === sheetAction ? ' active' : '');
      chip.textContent = code;
      chip.title = meta.full;
      chip.setAttribute('aria-pressed', code === sheetAction ? 'true' : 'false');
      chip.addEventListener('click', function () { sheetAction = code; renderSheetActionChips(); });
      wrap.appendChild(chip);
    });
  }

  function renderSheetSizeChips() {
    var wrap = el('sheet-sizes');
    if (!wrap) return;
    wrap.innerHTML = '';
    CONTAINER_SIZES.forEach(function (sz) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'sheet-chip' + (sz === sheetSize ? ' active' : '');
      chip.textContent = sz;
      chip.setAttribute('aria-pressed', sz === sheetSize ? 'true' : 'false');
      // Tap the active size again to clear it (size is optional).
      chip.addEventListener('click', function () {
        sheetSize = (sheetSize === sz) ? '' : sz;
        renderSheetSizeChips();
      });
      wrap.appendChild(chip);
    });
  }

  function openStopSheet(prefill, editId) {
    prefill = prefill || {};
    sheetMode = editId ? 'edit' : 'add';
    sheetEditId = editId || null;
    var pa = (prefill.action || '').toUpperCase();
    sheetAction = (ACTION_CODES.indexOf(pa) !== -1) ? pa : 'P';
    sheetSize = (CONTAINER_SIZES.indexOf(prefill.container_size) !== -1) ? prefill.container_size : '';
    el('sheet-title').textContent = editId ? 'Edit Stop' : 'Confirm Stop';
    el('sheet-add').textContent = editId ? 'Save' : 'Add Stop';
    el('sheet-customer').value = prefill.customer || '';
    var addrEl = el('sheet-address');
    addrEl.value = prefill.address || '';
    addrEl.classList.remove('invalid');
    el('sheet-dump').value = prefill.dump_leg || '';
    el('sheet-return').value = prefill.return_leg || '';
    el('sheet-note').value = prefill.notes || '';
    renderSheetActionChips();
    renderSheetSizeChips();
    var bd = el('stop-sheet-backdrop');
    bd.classList.add('open');
    bd.setAttribute('aria-hidden', 'false');
    var body = bd.querySelector('.sheet-body');
    if (body) body.scrollTop = 0;
  }
  window.openStopSheet = openStopSheet;

  function closeStopSheet(refocusQa) {
    var bd = el('stop-sheet-backdrop');
    bd.classList.remove('open');
    bd.setAttribute('aria-hidden', 'true');
    sheetEditId = null;
    if (refocusQa && qaInput) qaInput.focus();
  }

  function commitSheet() {
    var addrEl = el('sheet-address');
    var address = addrEl.value.trim();
    if (!address) {
      // Blank address blocks the commit and focuses the field.
      addrEl.classList.add('invalid');
      addrEl.focus();
      showToast('Address is required');
      return;
    }
    addrEl.classList.remove('invalid');
    var fields = {
      source: 'manual',
      action: sheetAction,
      address: address,
      customer: el('sheet-customer').value.trim(),
      container_size: sheetSize,
      dump_leg: el('sheet-dump').value.trim(),
      return_leg: el('sheet-return').value.trim(),
      notes: el('sheet-note').value.trim(),
    };

    if (sheetMode === 'edit' && sheetEditId) {
      // Save in place — same card, no duplicate.
      var existing = currentStops.find(function (s) { return s.id === sheetEditId; });
      if (existing) {
        existing.action = fields.action;
        existing.address = fields.address;
        existing.customer = fields.customer;
        existing.container_size = fields.container_size;
        existing.dump_leg = fields.dump_leg;
        existing.return_leg = fields.return_leg;
        existing.notes = fields.notes;
      }
      closeStopSheet(false);
      renderAllCards();
      updateCounts();
      showToast('Stop updated');
      return;
    }

    // Add mode: insert grouped with the other manual stops so manual stays first.
    var stop = normalizeStop(fields);
    var insertAt = 0;
    currentStops.forEach(function (s, i) { if (s.source === 'manual') insertAt = i + 1; });
    currentStops.splice(insertAt, 0, stop);
    closeStopSheet(false);
    renderAllCards();
    updateCounts();
    // Keep rapid-fire alive: clear the Quick-Add box and refocus it so the
    // keyboard stays up for the next entry.
    if (qaInput) { qaInput.value = ''; hideSuggest(); qaInput.focus(); }
    showToast('Added ' + (fields.customer || fields.address || 'stop'));
  }

  (function initStopSheet() {
    fillDatalist('sheet-dump-list', DUMP_SITES);
    fillDatalist('sheet-return-list', RETURN_SITES);
    var addBtn = el('sheet-add');
    if (addBtn) addBtn.addEventListener('click', commitSheet);
    var cancelBtn = el('sheet-cancel');
    if (cancelBtn) cancelBtn.addEventListener('click', function () { closeStopSheet(sheetMode === 'add'); });
    var closeBtn = el('sheet-close');
    if (closeBtn) closeBtn.addEventListener('click', function () { closeStopSheet(sheetMode === 'add'); });
    var bd = el('stop-sheet-backdrop');
    if (bd) bd.addEventListener('click', function (ev) {
      if (ev.target === bd) closeStopSheet(sheetMode === 'add');   // backdrop tap = cancel
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && bd && bd.classList.contains('open')) {
        closeStopSheet(sheetMode === 'add');
      }
    });
  })();

  // ── Quick add + live autocomplete ───────────────────────────────
  // A persistent lane above the raw-text box: type 2+ chars → live saved-
  // location suggestions; tap a suggestion (or a recent/frequent chip) to add
  // a pre-filled, editable stop card to the route. The field clears and keeps
  // focus so the keyboard stays up for rapid-fire entry. This never touches the
  // raw dispatch text box — that stays free-text parse only.
  var ACTION_BY_NAME = {
    'pickup and return': 'PR', 'pull and return': 'PR', 'p&r': 'PR', 'pr': 'PR',
    'pull': 'P', 'pickup': 'P', 'pick up': 'P', 'p': 'P',
    'delivery': 'D', 'deliver': 'D', 'drop': 'D', 'drop off': 'D', 'd': 'D',
    'swap': 'S', 's': 'S',
    'relocate': 'R', 'move': 'R', 'reposition': 'R', 'r': 'R',
  };
  function codeFromAction(name) {
    return ACTION_BY_NAME[(name || '').trim().toLowerCase()] || 'P';
  }

  var qaInput   = el('qa-input');
  var qaSuggest = el('qa-suggest');
  var qaChips   = el('qa-chips');
  var qaTimer   = null;
  var qaReqSeq  = 0;   // guards against out-of-order autocomplete responses

  function locFullAddress(loc) {
    var full = (loc.full_address || '').trim();
    if (full) return full;
    return [loc.address, loc.city, loc.state, loc.zip]
      .filter(function (p) { return p && String(p).trim(); })
      .join(', ');
  }

  function hideSuggest() { if (qaSuggest) { qaSuggest.hidden = true; qaSuggest.innerHTML = ''; } }

  function buildQaRow(loc) {
    var meta = ACTION_META[codeFromAction(loc.default_action)] || ACTION_META.P;
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'qa-row';
    row.setAttribute('role', 'option');

    var badge = document.createElement('span');
    badge.className = 'qa-badge badge-' + String(codeFromAction(loc.default_action) || 'D').toLowerCase();
    badge.textContent = codeFromAction(loc.default_action);
    row.appendChild(badge);

    var text = document.createElement('span');
    text.className = 'qa-text';
    var label = document.createElement('div');
    label.className = 'qa-label';
    label.textContent = loc.customer_name || locFullAddress(loc) || 'Saved location';
    text.appendChild(label);
    var sub = document.createElement('div');
    sub.className = 'qa-sub';
    sub.textContent = loc.customer_name ? locFullAddress(loc) : (loc.city || '');
    if (sub.textContent) text.appendChild(sub);
    row.appendChild(text);

    if (loc.default_container_size) {
      var size = document.createElement('span');
      size.className = 'qa-size';
      size.textContent = loc.default_container_size;
      row.appendChild(size);
    }

    // mousedown (not click) so we act before the input's blur hides the list.
    // Instead of committing instantly, open the Confirm-Stop sheet prefilled;
    // drop the keyboard so the sheet is fully visible (it comes back on commit).
    row.addEventListener('mousedown', function (ev) {
      ev.preventDefault();
      hideSuggest();
      if (qaInput) qaInput.blur();
      openStopSheet(prefillFromLoc(loc), null);
    });
    return row;
  }

  function renderSuggestions(list) {
    qaSuggest.innerHTML = '';
    if (!list || !list.length) {
      var empty = document.createElement('div');
      empty.className = 'qa-empty';
      empty.textContent = 'No saved match — dispatch it once and it’ll be here next time.';
      qaSuggest.appendChild(empty);
      qaSuggest.hidden = false;
      return;
    }
    list.forEach(function (loc) { qaSuggest.appendChild(buildQaRow(loc)); });
    qaSuggest.hidden = false;
  }

  function fetchSuggestions(q) {
    var mySeq = ++qaReqSeq;
    fetch('/api/address-suggestions?q=' + encodeURIComponent(q), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        if (mySeq !== qaReqSeq) return;               // a newer request superseded this one
        if (document.activeElement !== qaInput) return; // field lost focus meanwhile
        renderSuggestions(Array.isArray(list) ? list : []);
      })
      .catch(function () { /* silent — autocomplete is best-effort */ });
  }

  // Long-press helper (PWA-friendly; swipe is unreliable with gloves). Fires
  // `fn` after a ~550ms hold; cancels on move/early-release. Touch + mouse.
  function attachLongPress(elm, fn) {
    var timer = null, fired = false;
    function start() { fired = false; timer = setTimeout(function () { fired = true; fn(); }, 550); }
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    elm.addEventListener('touchstart', start, { passive: true });
    elm.addEventListener('touchend', cancel);
    elm.addEventListener('touchmove', cancel, { passive: true });
    elm.addEventListener('mousedown', start);
    elm.addEventListener('mouseup', cancel);
    elm.addEventListener('mouseleave', cancel);
    return function didFire() { return fired; };
  }

  // Dedupe key so two visually identical chips never render (name + street,
  // case/space-normalized). The DB dedupes on normalized address only, so a
  // display-level guard is the backstop.
  function chipKey(loc) {
    return ((loc.customer_name || '') + '|' + locFullAddress(loc))
      .toLowerCase().replace(/\s+/g, ' ').trim();
  }

  // Hide a saved location from the quick-add chips + autocomplete (soft — sets
  // the address-book `hidden` flag; re-dispatching that address brings it back).
  function hideLocation(loc, chipEl) {
    var label = loc.customer_name || locFullAddress(loc) || 'this location';
    if (!window.confirm('Remove “' + label + '” from quick-add?')) return;
    if (!loc.id) { if (chipEl) chipEl.remove(); return; }
    fetch('/api/locations/' + loc.id + '/hide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
      body: '{}',
      credentials: 'same-origin'
    }).then(function (r) {
      if (r.ok) { if (chipEl) chipEl.remove(); showToast('Removed from quick-add'); }
      else { showToast('Could not remove'); }
    }).catch(function () { showToast('Network error — try again'); });
  }

  function renderChips(list) {
    if (!qaChips) return;
    qaChips.innerHTML = '';
    if (!list || !list.length) return;
    var seen = {};
    list.forEach(function (loc) {
      var key = chipKey(loc);
      if (seen[key]) return;   // never render two identical chips
      seen[key] = 1;

      var chip = document.createElement('div');
      chip.className = 'qa-chip';

      // Tap area: badge + name (bold) + street subtext (small).
      var tap = document.createElement('button');
      tap.type = 'button';
      tap.className = 'qa-chip-tap';
      var b = document.createElement('span');
      b.className = 'qa-chip-badge';
      b.textContent = codeFromAction(loc.default_action);
      tap.appendChild(b);

      var txt = document.createElement('span');
      txt.className = 'qa-chip-text';
      var nm = document.createElement('span');
      nm.className = 'qa-chip-name';
      nm.textContent = loc.customer_name || locFullAddress(loc) || 'Saved';
      txt.appendChild(nm);
      var street = loc.customer_name ? locFullAddress(loc) : (loc.city || '');
      if (street) {
        var sub = document.createElement('span');
        sub.className = 'qa-chip-sub';
        sub.textContent = street;
        txt.appendChild(sub);
      }
      tap.appendChild(txt);

      var didLongPress = attachLongPress(tap, function () { hideLocation(loc, chip); });
      tap.addEventListener('click', function () {
        if (didLongPress()) return;   // a long-press just removed/asked — don't also open
        openStopSheet(prefillFromLoc(loc), null);
      });
      chip.appendChild(tap);

      // Explicit ✕ (long-press is the alternative). ≥48px touch target.
      var x = document.createElement('button');
      x.type = 'button';
      x.className = 'qa-chip-x';
      x.setAttribute('aria-label', 'Remove ' + (loc.customer_name || 'location') + ' from quick-add');
      x.textContent = '✕';
      x.addEventListener('click', function (ev) { ev.stopPropagation(); hideLocation(loc, chip); });
      chip.appendChild(x);

      qaChips.appendChild(chip);
    });
  }

  function loadChips() {
    fetch('/api/locations/top?limit=8', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) { renderChips(Array.isArray(list) ? list : []); })
      .catch(function () { /* silent */ });
  }

  if (qaInput) {
    qaInput.addEventListener('input', function () {
      var v = qaInput.value.trim();
      clearTimeout(qaTimer);
      if (v.length < 2) { hideSuggest(); return; }
      qaTimer = setTimeout(function () { fetchSuggestions(v); }, 150);
    });
    qaInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { hideSuggest(); }
    });
    // Delay hide so a suggestion's mousedown fires first.
    qaInput.addEventListener('blur', function () {
      setTimeout(hideSuggest, 150);
    });
    loadChips();
  }

  var driverSelectEl = el('driver-select');
  if (driverSelectEl) {
    driverSelectEl.addEventListener('change', updateCounts);
  }
})();
</script>
</body>
</html>
