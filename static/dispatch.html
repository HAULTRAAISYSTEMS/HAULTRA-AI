<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>HAULTRA Dispatch</title>
  <style>
    /* === RESET & BASE === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d1a;
      --surface: #1a1a2e;
      --surface2: #252540;
      --accent: #00c8ff;
      --accent2: #7c3aed;
      --text: #f0f0ff;
      --text-muted: #9090b0;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --pending: #6366f1;
      --accepted: #3b82f6;
      --in-progress: #f59e0b;
      --done: #22c55e;
      --cancelled: #6b7280;
      --radius: 12px;
      --radius-sm: 8px;
    }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; }
    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; gap: 24px;
    }
    .login-card {
      background: var(--surface); border-radius: var(--radius); padding: 32px;
      width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,255,0.15);
    }
    .login-card h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent); }
    .login-card p { color: var(--text-muted); margin-bottom: 24px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 0.85rem; color: var(--text-muted); }
    .field input {
      padding: 14px 16px; background: var(--surface2); border: 1px solid #333355;
      border-radius: var(--radius-sm); color: var(--text); font-size: 1rem;
      min-height: 48px; outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--accent); }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px; border: none; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 1rem; font-weight: 600; min-height: 48px; transition: opacity 0.2s, transform 0.1s;
      text-decoration: none; width: 100%;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 8px 14px; min-height: 36px; font-size: 0.85rem; width: auto; }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 8px; min-height: 20px; }
    #app { display: none; flex-direction: column; height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--surface);
      border-bottom: 1px solid #252540; flex-shrink: 0;
    }
    .topbar h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .user-chip {
      font-size: 0.8rem; color: var(--text-muted); background: var(--surface2);
      padding: 6px 12px; border-radius: 20px;
    }
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .driver-sidebar {
      width: 220px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid #252540; overflow-y: auto; padding: 16px 12px;
    }
    .driver-sidebar h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }
    .driver-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 12px; border-radius: var(--radius-sm); border: none; background: transparent;
      color: var(--text); cursor: pointer; text-align: left; min-height: 48px;
      transition: background 0.15s; font-size: 0.95rem;
    }
    .driver-btn:hover { background: var(--surface2); }
    .driver-btn.active { background: var(--surface2); border-left: 3px solid var(--accent); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-active { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot-idle { background: var(--text-muted); }
    .dispatch-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .dispatch-input-area {
      padding: 16px; background: var(--surface); border-bottom: 1px solid #252540; flex-shrink: 0;
    }
    .dispatch-input-area h2 { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 10px; }
    .dispatch-row { display: flex; gap: 10px; }
    .dispatch-row textarea {
      flex: 1; padding: 12px; background: var(--surface2); border: 1px solid #333355;
      border-radius: var(--radius-sm); color: var(--text); font-size: 1rem; resize: vertical;
      min-height: 80px; outline: none; font-family: inherit;
    }
    .dispatch-row textarea:focus { border-color: var(--accent); }
    .dispatch-row .btn-send {
      align-self: flex-end; background: var(--accent); color: #000; padding: 14px 20px;
      border-radius: var(--radius-sm); border: none; cursor: pointer; font-weight: 700;
      font-size: 1rem; min-height: 48px; white-space: nowrap; min-width: 80px;
    }
    .parsed-preview {
      margin-top: 8px; font-size: 0.8rem; color: var(--text-muted);
      background: var(--surface2); padding: 8px 12px; border-radius: var(--radius-sm);
      min-height: 28px;
    }
    .parsed-preview span { color: var(--accent); font-weight: 600; }
    .live-board { flex: 1; overflow-y: auto; padding: 16px; }
    .board-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .board-header h2 { font-size: 1rem; }
    .today-label { font-size: 0.8rem; color: var(--text-muted); }
    .stop-card {
      background: var(--surface); border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 10px; border-left: 4px solid var(--pending);
      display: flex; align-items: flex-start; gap: 12px; transition: opacity 0.3s;
    }
    .stop-card[data-status="pending"]     { border-color: var(--pending); }
    .stop-card[data-status="accepted"]    { border-color: var(--accepted); }
    .stop-card[data-status="in_progress"] { border-color: var(--in-progress); }
    .stop-card[data-status="done"]        { border-color: var(--done); opacity: 0.7; }
    .stop-card[data-status="cancelled"]   { border-color: var(--cancelled); opacity: 0.5; }
    .action-badge {
      padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 1px; flex-shrink: 0; background: var(--surface2);
      color: var(--accent); border: 1px solid var(--accent);
    }
    .stop-info { flex: 1; }
    .stop-address { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .stop-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .pill-pending     { background: #312e81; color: #a5b4fc; }
    .pill-accepted    { background: #1e3a5f; color: #93c5fd; }
    .pill-in_progress { background: #451a03; color: #fcd34d; }
    .pill-done        { background: #14532d; color: #86efac; }
    .pill-cancelled   { background: #1f2937; color: #9ca3af; }
    .cancel-btn {
      background: none; border: 1px solid var(--danger); color: var(--danger);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
      min-height: 36px; flex-shrink: 0; transition: background 0.2s;
    }
    .cancel-btn:hover { background: rgba(239,68,68,0.1); }
    .cancel-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .driver-group { margin-bottom: 24px; }
    .driver-group-header {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted); margin-bottom: 8px; padding-bottom: 4px;
      border-bottom: 1px solid #252540;
    }
    .empty-state { text-align: center; color: var(--text-muted); padding: 48px 24px; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    @media (max-width: 600px) {
      .driver-sidebar { width: 60px; }
      .driver-btn span { display: none; }
    }
  </style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <h1>HAULTRA</h1>
    <p>Dispatch Command Center</p>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="boss@company.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <h1>HAULTRA DISPATCH</h1>
    <div class="topbar-right">
      <span class="user-chip" id="user-chip">Loading...</span>
      <button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="main-layout">
    <aside class="driver-sidebar">
      <h2>Drivers</h2>
      <div id="driver-list">
        <div style="color:var(--text-muted);font-size:0.8rem;padding:8px 0;">Loading...</div>
      </div>
    </aside>
    <div class="dispatch-panel">
      <div class="dispatch-input-area">
        <h2 id="dispatch-target-label">Select a driver to dispatch</h2>
        <div class="dispatch-row">
          <textarea id="dispatch-text" placeholder="Type dispatch text, e.g.: PR 4512 Elm St swap 30yd" oninput="previewParse()"></textarea>
          <button class="btn-send" onclick="sendDispatch()">SEND</button>
        </div>
        <div class="parsed-preview" id="parsed-preview">Type dispatch text above to preview parsing...</div>
      </div>
      <div class="live-board">
        <div class="board-header">
          <h2>Today's Stops</h2>
          <span class="today-label" id="today-label"></span>
        </div>
        <div id="stops-board">
          <div class="empty-state">
            <div class="icon">🚛</div>
            <div>No stops yet today. Select a driver and send a dispatch.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                                from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot,
         query, where, orderBy, serverTimestamp, getDoc, Timestamp }
                                from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { firebaseConfig, COMPANY_ID } from './firebase-config.js';

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

let selectedDriverUid  = null;
let selectedDriverName = '';
let unsubStops         = null;
let unsubDrivers       = null;

window.doLogin = async function () {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');
  errEl.textContent = '';
  btn.textContent   = 'Signing in...';
  btn.disabled      = true;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    errEl.textContent = friendlyAuthError(e.code);
    btn.textContent   = 'Sign In';
    btn.disabled      = false;
  }
};

window.doLogout = async function () {
  if (unsubStops)   unsubStops();
  if (unsubDrivers) unsubDrivers();
  await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const companyDoc = await getDoc(doc(db, 'companies', COMPANY_ID));
    if (!companyDoc.exists() || companyDoc.data().ownerUid !== user.uid) {
      document.getElementById('login-error').textContent = 'Access denied — only the company owner can use Dispatch.';
      await signOut(auth);
      return;
    }
    showApp(user);
    subscribeDrivers();
    subscribeStops();
  } else {
    showLogin();
  }
});

function showApp(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display          = 'flex';
  document.getElementById('user-chip').textContent      = user.email;
  document.getElementById('today-label').textContent    = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display          = 'none';
  document.getElementById('login-btn').textContent      = 'Sign In';
  document.getElementById('login-btn').disabled         = false;
}

function friendlyAuthError(code) {
  const map = {
    'auth/invalid-email':     'Invalid email address.',
    'auth/user-not-found':    'No account found with that email.',
    'auth/wrong-password':    'Incorrect password.',
    'auth/too-many-requests': 'Too many attempts. Try again later.',
  };
  return map[code] || 'Login failed. Please try again.';
}

function subscribeDrivers() {
  const driversRef = collection(db, 'companies', COMPANY_ID, 'drivers');
  unsubDrivers = onSnapshot(driversRef, (snap) => {
    const drivers = [];
    snap.forEach((d) => drivers.push({ uid: d.id, ...d.data() }));
    renderDriverList(drivers);
  });
}

function renderDriverList(drivers) {
  const el  = document.getElementById('driver-list');
  const now = Date.now();
  el.innerHTML = '';
  if (!drivers.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;padding:8px 0;">No drivers yet.</div>';
    return;
  }
  drivers.forEach((d) => {
    const lastSeen = d.lastSeen?.toMillis?.() || 0;
    const active   = (now - lastSeen) < 15 * 60 * 1000;
    const btn      = document.createElement('button');
    btn.className  = 'driver-btn' + (d.uid === selectedDriverUid ? ' active' : '');
    btn.dataset.uid = d.uid;
    btn.innerHTML  = '<span class="status-dot ' + (active ? 'dot-active' : 'dot-idle') + '"></span><span>' + (d.name || d.uid) + '</span>';
    btn.onclick    = () => selectDriver(d.uid, d.name || d.uid);
    el.appendChild(btn);
  });
}

function selectDriver(uid, name) {
  selectedDriverUid  = uid;
  selectedDriverName = name;
  document.querySelectorAll('.driver-btn').forEach((b) =>
    b.classList.toggle('active', b.dataset.uid === uid)
  );
  document.getElementById('dispatch-target-label').textContent = 'Dispatching to: ' + name;
}

const ACTION_RE    = /(PR|P|D|S|R)/i;
const CONTAINER_RE = /(10|20|30|40)s*yd/i;

function parseDispatch(raw) {
  const text    = (raw || '').trim();
  const actionM = text.match(ACTION_RE);
  const sizeM   = text.match(CONTAINER_RE);
  let address = text
    .replace(ACTION_RE, '')
    .replace(CONTAINER_RE, '')
    .replace(/swap/gi, '')
    .replace(/s+/g, ' ')
    .trim();
  return {
    actionCode:    actionM ? actionM[1].toUpperCase() : null,
    containerSize: sizeM   ? sizeM[0].replace(/s/, '').toLowerCase() : null,
    address:       address || text,
  };
}

window.previewParse = function () {
  const raw     = document.getElementById('dispatch-text').value;
  const preview = document.getElementById('parsed-preview');
  if (!raw.trim()) {
    preview.textContent = 'Type dispatch text above to preview parsing...';
    return;
  }
  const { actionCode, containerSize, address } = parseDispatch(raw);
  preview.innerHTML = 'Action: <span>' + (actionCode || '—') + '</span> &nbsp;|&nbsp; Container: <span>' + (containerSize || '—') + '</span> &nbsp;|&nbsp; Address: <span>' + (address || '—') + '</span>';
};

window.sendDispatch = async function () {
  if (!selectedDriverUid) { alert('Select a driver first.'); return; }
  const rawText = document.getElementById('dispatch-text').value.trim();
  if (!rawText) { alert('Enter dispatch text.'); return; }
  const { actionCode, containerSize, address } = parseDispatch(rawText);
  const user = auth.currentUser;
  try {
    const stopsRef = collection(db, 'companies', COMPANY_ID, 'stops');
    await addDoc(stopsRef, {
      driverUid:     selectedDriverUid,
      rawText,
      address:       address || rawText,
      actionCode:    actionCode || 'P',
      containerSize: containerSize || null,
      notes:         '',
      status:        'pending',
      sequence:      Date.now(),
      createdAt:     serverTimestamp(),
      updatedAt:     serverTimestamp(),
      statusHistory: [{ status: 'pending', at: new Date().toISOString(), byUid: user.uid }],
    });
    document.getElementById('dispatch-text').value = '';
    document.getElementById('parsed-preview').textContent = 'Sent! Type next dispatch...';
  } catch (e) {
    console.error('Send dispatch error:', e);
    alert('Failed to send dispatch: ' + e.message);
  }
};

function subscribeStops() {
  const todayStart = new Date();
  todayStart.setHours(0, 0, 0, 0);
  const stopsRef = collection(db, 'companies', COMPANY_ID, 'stops');
  const q = query(stopsRef, where('createdAt', '>=', Timestamp.fromDate(todayStart)), orderBy('createdAt', 'asc'));
  unsubStops = onSnapshot(q, (snap) => {
    const stops = [];
    snap.forEach((d) => stops.push({ id: d.id, ...d.data() }));
    renderBoard(stops);
  });
}

const driverNames = {};
async function getDriverName(uid) {
  if (driverNames[uid]) return driverNames[uid];
  try {
    const d = await getDoc(doc(db, 'companies', COMPANY_ID, 'drivers', uid));
    driverNames[uid] = d.exists() ? (d.data().name || uid) : uid;
  } catch { driverNames[uid] = uid; }
  return driverNames[uid];
}

function renderBoard(stops) {
  const board = document.getElementById('stops-board');
  if (!stops.length) {
    board.innerHTML = '<div class="empty-state"><div class="icon">🚛</div><div>No stops yet today.</div></div>';
    return;
  }
  const groups = {};
  stops.forEach((s) => {
    if (!groups[s.driverUid]) groups[s.driverUid] = [];
    groups[s.driverUid].push(s);
  });
  board.innerHTML = '';
  Object.entries(groups).forEach(([duid, dstops]) => {
    const group = document.createElement('div');
    group.className = 'driver-group';
    const name = driverNames[duid] || duid;
    group.innerHTML = '<div class="driver-group-header">' + name + ' — ' + dstops.length + ' stop' + (dstops.length !== 1 ? 's' : '') + '</div>';
    dstops.forEach((stop) => {
      const card = document.createElement('div');
      card.className = 'stop-card';
      card.dataset.status = stop.status;
      const createdAt = stop.createdAt?.toDate?.()?.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) || '';
      const canCancel = stop.status !== 'cancelled' && stop.status !== 'done';
      card.innerHTML =
        '<span class="action-badge">' + (stop.actionCode || 'P') + '</span>' +
        '<div class="stop-info">' +
          '<div class="stop-address">' + stop.address + '</div>' +
          '<div class="stop-meta">' +
            (stop.containerSize ? '<span>' + stop.containerSize + '</span>' : '') +
            '<span class="status-pill pill-' + stop.status + '">' + stop.status.replace('_', ' ') + '</span>' +
            (createdAt ? '<span>' + createdAt + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="cancel-btn" onclick="cancelStop(' + "'" + stop.id + "'" + ')" ' + (canCancel ? '' : 'disabled') + '>' +
          (stop.status === 'cancelled' ? 'Cancelled' : 'Cancel') +
        '</button>';
      group.appendChild(card);
    });
    board.appendChild(group);
    getDriverName(duid).then((n) => {
      driverNames[duid] = n;
      const header = group.querySelector('.driver-group-header');
      if (header) header.textContent = n + ' — ' + dstops.length + ' stop' + (dstops.length !== 1 ? 's' : '');
    });
  });
}

window.cancelStop = async function (stopId) {
  if (!confirm('Cancel this stop?')) return;
  const user = auth.currentUser;
  try {
    const stopRef = doc(db, 'companies', COMPANY_ID, 'stops', stopId);
    const snap    = await getDoc(stopRef);
    const prev    = snap.data()?.statusHistory || [];
    await updateDoc(stopRef, {
      status:        'cancelled',
      updatedAt:     serverTimestamp(),
      statusHistory: [...prev, { status: 'cancelled', at: new Date().toISOString(), byUid: user.uid }],
    });
  } catch (e) {
    alert('Failed to cancel stop: ' + e.message);
  }
};
</script>
</body>
</html>
