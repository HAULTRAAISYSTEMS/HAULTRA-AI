name: Production readiness

on:
  pull_request:
  # 2026-10-31: push trigger RE-ENABLED, backend only. It was disabled on
  # Oct 22 because the Android/iOS builds failed on every push and spammed
  # failure emails. The cost of that silence: a stale Python pin broke the
  # backend job and nobody knew for nine days, because nothing watched main.
  # The mobile jobs now carry an `if` that keeps them to pull_request, so a
  # push to main runs the Python suite and nothing else.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 2026-10-31: was pinned to "3.11.9". GitHub prunes exact patch
          # releases from the hosted runner's tool cache, and once 3.11.9
          # left it the step died in ~1s before any test ran. The app is
          # not sensitive to the patch level -- Render pins the deploy
          # separately via .python-version -- so track the 3.11 line.
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py scripts/*.py tests/*.py
      - name: Run regression suites
        run: |
          for test_file in tests/test_*.py; do
            python "$test_file"
          done

  android:
    # PR-only: these builds are slow and still flaky, and a failure on a
    # push to main would just be email noise. Keep them on the gate where
    # someone is actually looking at the result.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npx cap sync android
      - name: Build unsigned release bundle
        run: ./android/gradlew -p android test bundleRelease -PHAULTRA_VERSION_CODE=1 -PHAULTRA_VERSION_NAME=1.0.0

  ios:
    # PR-only, same reason as android.
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - run: pod install --project-directory=ios/App
      - name: Build unsigned iOS release
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
