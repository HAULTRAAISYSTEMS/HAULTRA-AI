services:
  - type: web
    name: haultra-ai-systems
    runtime: python
    buildCommand: pip install -r requirements.txt
    # gevent async workers: long-lived SSE streams (driver Cab View realtime)
    # are idle greenlets that yield instead of pinning a thread, so they can't
    # starve normal requests. --worker-connections caps concurrent greenlets
    # per worker; --timeout 120 keeps gunicorn from killing a streaming worker.
    startCommand: gunicorn app:app -k gevent --workers 2 --worker-connections 1000 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render auto-generates a secure random value
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_PATH
        value: haultra.db
      - key: UPLOAD_FOLDER
        value: static/uploads
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in Render dashboard — never commit the value
      - key: RESEND_API_KEY
        sync: false   # set manually in Render dashboard — never commit the value. Required for password-reset emails.
      - key: RESEND_FROM_EMAIL
        sync: false   # set manually in Render dashboard — e.g. "HAULTRA <noreply@haultra-systems.com>"
      - key: STRIPE_SECRET_KEY
        sync: false   # set manually in Render dashboard — never commit the value
      - key: STRIPE_PRICE_STARTER
        sync: false   # set manually in Render dashboard — Stripe Price ID for the Starter plan
      - key: STRIPE_PRICE_PRO
        sync: false   # set manually in Render dashboard — Stripe Price ID for the Pro plan
      - key: STRIPE_WEBHOOK_SECRET
        sync: false   # set manually in Render dashboard — never commit the value
      - key: FCM_PROJECT_ID
        sync: false   # Firebase console -> Project settings -> General. Push is off until this is set.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false   # ... -> Service accounts -> Generate new private key. Paste the whole JSON blob.
      - key: FCM_VAPID_PUBLIC_KEY
        sync: false   # ... -> Cloud Messaging -> Web Push certificates. Lets a browser ask for a token.
      - key: APPLE_TEAM_ID
        sync: false   # Apple Developer Team ID for Universal Links
      - key: ANDROID_SHA256_FINGERPRINT
        sync: false   # Play App Signing certificate SHA-256 fingerprint
      - key: BACKUP_S3_BUCKET
        sync: false   # required for independent disaster-recovery backups
      - key: BACKUP_S3_PREFIX
        value: haultra-production
      - key: BACKUP_S3_REGION
        value: us-east-1
      - key: BACKUP_S3_ENDPOINT
        sync: false   # optional for non-AWS S3-compatible storage
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
    disk:
      name: haultra-data
      mountPath: /opt/render/project/src
      sizeGB: 1
